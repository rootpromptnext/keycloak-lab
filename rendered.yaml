# Source: keycloak/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: my-keycloak
  namespace: keycloak
  labels:
    app.kubernetes.io/instance: my-keycloak
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: keycloak
    app.kubernetes.io/version: 26.8.0
    helm.sh/chart: keycloak-0.21.46
spec:
  serviceName: my-keycloak-headless
  podManagementPolicy: OrderedReady
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: my-keycloak
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: my-keycloak
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/version: 26.8.0
        helm.sh/chart: keycloak-0.21.46
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext: 
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: copy-quarkus-lib
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          image: docker.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
          imagePullPolicy: Always
          command: ["sh", "-c", "cp -r /opt/keycloak/lib/quarkus/* /shared-quarkus/"]
          volumeMounts:
            - name: keycloak-lib-quarkus
              mountPath: /shared-quarkus
          resources:
            {}
        - name: wait-for-postgres
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          image: postgres:18.6@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h my-keycloak-postgres -p 5432 -U postgres; do echo waiting for database; sleep 2; done;"]
          resources:
            {}
      containers:
        - name: keycloak
          securityContext: 
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
          image: docker.io/keycloak/keycloak:26.8.0@sha256:b0f60d489d51c5d113390bdf5461d4c06e6051be026c05549f2e1e10ec352bcc
          imagePullPolicy: Always
          command:
            - /opt/keycloak/bin/kc.sh
          args:
            - start-dev
            - --http-enabled=true
            - --hostname=http://keycloak.local
            - --hostname-strict=false
            - --proxy-headers=xforwarded
            - --http-port=8080
            - --https-port=8443
            - --http-management-port=9000
            - --db=postgres
            - --db-url=jdbc:postgresql://my-keycloak-postgres:5432/keycloak
            - --health-enabled=true
          env:
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: admin-password
            - name: KC_DB
              value: postgres
            - name: KC_DB_USERNAME
              value: "postgres"
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-postgres
                  key: postgres-password
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: management
              containerPort: 9000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /health/live
              port: management
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 60
          resources:
            {}
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: tmp
              mountPath: /tmp
            - name: keycloak-work
              mountPath: /opt/keycloak/work
            - name: keycloak-lib-quarkus
              mountPath: /opt/keycloak/lib/quarkus
            - name: keycloak-themes
              mountPath: /opt/keycloak/themes
            - name: keycloak-providers
              mountPath: /opt/keycloak/providers
      volumes:
        - name: tmp
          emptyDir: {}
        - name: keycloak-work
          emptyDir: {}
        - name: keycloak-lib-quarkus
          emptyDir: {}
        - name: keycloak-themes
          emptyDir: {}
        - name: keycloak-providers
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/instance: my-keycloak
          app.kubernetes.io/name: keycloak
      spec:
        accessModes:
          - "ReadWriteOnce"
        resources:
          requests:
            storage: "1Gi"
